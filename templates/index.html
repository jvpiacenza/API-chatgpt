<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat com IA</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0f12;
            --surface: #13161b;
            --surface-2: #1c2028;
            --border: #252a33;
            --accent: #00e5a0;
            --accent-dim: rgba(0, 229, 160, 0.1);
            --accent-glow: rgba(0, 229, 160, 0.25);
            --text: #e8eaf0;
            --text-muted: #616878;
            --text-subtle: #8b92a5;
            --danger: #ff5f5f;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            /* subtle noise texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
        }

        /* animated grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,229,160,0.06) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .header-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow), 0 0 20px var(--accent-glow);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.6; transform: scale(0.85); }
        }

        h1 {
            font-family: 'DM Mono', monospace;
            font-size: 1rem;
            font-weight: 400;
            color: var(--accent);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .header-tag {
            margin-left: auto;
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            color: var(--text-muted);
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 0.04em;
        }

        /* ── Card ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 24px 48px rgba(0,0,0,0.5);
        }

        .card-body {
            padding: 2rem;
        }

        /* ── Form ── */
        .form-label {
            display: block;
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
        }

        .input-row {
            display: flex;
            gap: 0.6rem;
        }

        input[type="text"] {
            flex: 1;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            padding: 0.75rem 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        button[type="submit"] {
            background: var(--accent);
            color: #050a08;
            border: none;
            border-radius: 10px;
            font-family: 'DM Mono', monospace;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            padding: 0.75rem 1.25rem;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
            white-space: nowrap;
        }

        button[type="submit"]:hover {
            opacity: 0.88;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        button[type="submit"]:active {
            transform: translateY(0);
            opacity: 1;
        }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 0 2rem;
        }

        /* ── Response block ── */
        .response-block {
            padding: 1.75rem 2rem;
            animation: fadeUp 0.4s ease both;
        }

        .response-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            color: var(--accent);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.9rem;
        }

        .response-label::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        .response-text {
            font-size: 0.97rem;
            line-height: 1.75;
            color: var(--text-subtle);
            font-style: italic;
            border-left: 2px solid var(--accent);
            padding-left: 1.1rem;
        }

        /* ── Footer ── */
        .footer {
            margin-top: 1.5rem;
            text-align: center;
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.06em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-dot"></div>
            <h1>Converse com o ChatGPT</h1>
            <span class="header-tag">Flask · GPT</span>
        </div>

        <div class="card">
            <div class="card-body">
                <label class="form-label" for="pergunta">Sua pergunta</label>
                <form method="POST">
                    <div class="input-row">
                        <input
                            type="text"
                            id="pergunta"
                            name="pergunta"
                            value="{{ pergunta }}"
                            placeholder="Digite algo..."
                            required
                            autocomplete="off"
                        >
                        <button type="submit">Enviar</button>
                    </div>
                </form>
            </div>

            {% if resposta %}
                <div class="divider"></div>
                <div class="response-block">
                    <div class="response-label">Resposta</div>
                    <p class="response-text">{{ resposta }}</p>
                </div>
            {% endif %}
        </div>

        <p class="footer">powered by openai · flask · python</p>
    </div>
</body>
</html>
